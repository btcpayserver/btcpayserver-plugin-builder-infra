x-broker-token-path: &broker-token-path /run/secrets/build_broker_token

services:
  nginx:
    restart: unless-stopped
    image: nginx:1.25.3-bookworm
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "nginx_conf:/etc/nginx/conf.d"
      - "nginx_vhost:/etc/nginx/vhost.d"
      - "nginx_html:/usr/share/nginx/html"
      - "nginx_certs:/etc/nginx/certs:ro"

  nginx-gen:
    restart: unless-stopped
    image: btcpayserver/docker-gen:0.10.7
    container_name: nginx-gen
    volumes:
      - "/var/run/docker.sock:/tmp/docker.sock:ro"
      - "./nginx.tmpl:/etc/docker-gen/templates/nginx.tmpl:ro"
      - "nginx_conf:/etc/nginx/conf.d"
      - "nginx_vhost:/etc/nginx/vhost.d"
      - "nginx_html:/usr/share/nginx/html"
      - "nginx_certs:/etc/nginx/certs:ro"
    entrypoint: /usr/local/bin/docker-gen -notify-sighup nginx -watch -wait 5s:30s /etc/docker-gen/templates/nginx.tmpl /etc/nginx/conf.d/default.conf
    links:
      - nginx

  letsencrypt-nginx-proxy-companion:
    restart: unless-stopped
    image: btcpayserver/letsencrypt-nginx-proxy-companion:2.2.9-2
    container_name: letsencrypt-nginx-proxy-companion
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "nginx_conf:/etc/nginx/conf.d"
      - "nginx_vhost:/etc/nginx/vhost.d"
      - "nginx_html:/usr/share/nginx/html"
      - "nginx_certs:/etc/nginx/certs:rw"
      - "acme:/etc/acme.sh"
    environment:
      NGINX_DOCKER_GEN_CONTAINER: "nginx-gen"
      NGINX_PROXY_CONTAINER: "nginx"
      ACME_CA_URI: ${ACME_CA_URI:-https://acme-v01.api.letsencrypt.org/directory}
    links:
      - nginx-gen

  postgres:
    restart: unless-stopped
    image: postgres:17.6
    command: [ "-c", "random_page_cost=1.0", "-c", "shared_preload_libraries=pg_stat_statements" ]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - "postgres_datadir:/var/lib/postgresql/data"

  plugin-builder:
    restart: unless-stopped
    stop_grace_period: 210s
    image: btcpayserver/btcpayserver-plugin-builder:v1.0.78
    pull_policy: always
    environment:
      PB_BUILD_BROKER_URL: http://build-broker:8080
      PB_BUILD_BROKER_TOKEN_FILE: *broker-token-path
      XDG_CONFIG_HOME: /datadir
      PB_POSTGRES: Application Name=plugin-builder;User ID=postgres;Host=postgres;Port=5432;Database=pluginbuilder
      PB_STORAGE_CONNECTION_STRING: ${PB_STORAGE_CONNECTION_STRING}
      PB_DEBUGLOG: debug.log
      PB_DEBUGLOGLEVEL: Debug,
      PB_DEBUGLOGRETAINCOUNT: 3
      PB_ALLOWEDHOSTS: ${PB_HOST}
      PB_GITHUB_TOKEN: ${PB_GITHUB_TOKEN}
      PB_BTCMAPS__BTCMAPIMPORTTOKEN: ${PB_BTCMAPS_BTCMAP_IMPORT_TOKEN}
      PB_BTCMAPS__DIRECTORYGITHUBTOKEN: ${PB_BTCMAPS_DIRECTORY_GITHUB_TOKEN}
      VIRTUAL_HOST_NAME: pluginbuilder
      VIRTUAL_HOST: ${PB_HOST}
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: ${PB_HOST}
    expose:
      - "8080"
    volumes:
      - "pluginbuilder_datadir:/datadir"
    # Only completed, hash-verified broker downloads are buffered here. This is
    # private app storage, not a host scratch mount shared with build workers.
    tmpfs:
      - /datadir/BTCPayServer-PluginBuilder/broker-staging:rw,noexec,nosuid,nodev,size=600m,mode=0700
    secrets:
      - source: build_broker_token
        target: *broker-token-path
    networks:
      - default
      - build_control

  build-broker:
    restart: unless-stopped
    image: btcpayserver/btcpayserver-plugin-builder-broker:v1.0.78
    pull_policy: always
    environment:
      ASPNETCORE_URLS: http://+:8080
      PBB_WORKER_IMAGE: btcpayserver/btcpayserver-plugin-builder-worker:v1.0.78
      PBB_BUILD_SCRATCH_ROOT: ${PB_BUILD_SCRATCH_ROOT:?Set PB_BUILD_SCRATCH_ROOT to an existing private scratch directory}
      PBB_TOKEN_FILE: *broker-token-path
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 210s
    healthcheck:
      # The executable reads the token file; it never puts the token in argv.
      test: ["CMD", "/app/PluginBuilder.BuildBroker", "--healthcheck"]
      interval: 15s
      timeout: 10s
      start_period: 15m
      retries: 3
    volumes:
      # Never share the application's data volume or credentials with the broker.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      # The scratch path must be identical on the Docker host and in the broker.
      - type: bind
        source: ${PB_BUILD_SCRATCH_ROOT:?Set PB_BUILD_SCRATCH_ROOT}
        target: ${PB_BUILD_SCRATCH_ROOT:?Set PB_BUILD_SCRATCH_ROOT}
        bind:
          create_host_path: false
    secrets:
      - source: build_broker_token
        target: *broker-token-path
    networks:
      - build_control

networks:
    default:
    # Only the API and broker join this network. It has no external route.
    build_control:
      internal: true

secrets:
    build_broker_token:
      file: ${PB_BUILD_BROKER_TOKEN_FILE:?Set PB_BUILD_BROKER_TOKEN_FILE to a private absolute token-file path}

volumes:
    nginx_conf:
    nginx_vhost:
    nginx_html:
    nginx_certs:
    postgres_datadir: 
    pluginbuilder_datadir:
    acme:
